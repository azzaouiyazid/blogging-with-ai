[wordpress]
host=http://0.0.0.0:80
username=<your username>
password=<your password>

[llm]
# Provider selection: gemini (default) or openai
provider = gemini

[gemini]
# Preferred production auth: service_account_file (Google service account JSON)
# Example: /home/user/keys/gemini-service-account.json
service_account_file = /path/to/service-account.json
# Optional API key fallback (not recommended for production)
api_key = YOUR_GOOGLE_API_KEY
model = text-bison-001

[gtp3]
# Kept for backward compatibility and optional fallback
apikey = <your openai apikey>
maxtoken=2000

[newsapi]
api_key = YOUR_NEWSAPI_KEY

[serpapi]
api_key = YOUR_SERPAPI_KEY

[search_console]
SCOPES=https://www.googleapis.com/auth/indexing
ENDPOINT=https://indexing.googleapis.com/v3/urlNotifications:publish
# service_account_file.json is the private key that you created for your service account.
JSON_KEY_FILE=<filepath to your json>

[unsplash]
accesskey=<your accesskey>
secretkey=<your secretkey>

[shopify]
store = your-store.myshopify.com
api_token = YOUR_SHOPIFY_ADMIN_API_TOKEN
blog_id = 123456789
api_version = 2024-10
# optional
blog_handle = news

[telegram]
bot_token = YOUR_TELEGRAM_BOT_TOKEN
review_chat_id = YOUR_TELEGRAM_CHAT_ID
